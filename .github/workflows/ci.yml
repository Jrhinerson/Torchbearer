name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TORCHBEARER_DATA_DIR: ${{ runner.temp }}/torchbearer-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and apply fresh migrations
        run: python scripts/setup.py
      - name: Run static, migration, API, and frontend checks
        run: python scripts/check.py
      - name: Verify persistence across a backend restart
        run: python scripts/check_persistence.py
      - name: Verify launcher shutdown
        if: runner.os == 'Linux'
        run: python scripts/check_launcher.py
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser integration checks
        run: npm run test:e2e --prefix frontend
